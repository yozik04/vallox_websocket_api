[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vallox_websocket_api"
dynamic = ["version"]
description = "Vallox WebSocket API"
readme = "README.md"
requires-python = ">=3.11"
license = "LGPL-3.0-only"
license-files = ["LICENSE.txt"]
authors = [{ name = "Jevgeni Kiski", email = "yozik04@gmail.com" }]
keywords = ["vallox", "api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "websockets >= 17",
    "construct >= 2.9.0, < 3.0.0",
    "aiohttp >= 3.7.0, < 4.0.0",
]

[project.urls]
Homepage = "https://github.com/yozik04/vallox_websocket_api"
"Bug Tracker" = "https://github.com/yozik04/vallox_websocket_api/issues"
Changelog = "https://github.com/yozik04/vallox_websocket_api/releases"

[dependency-groups]
test = ["pytest", "pytest-asyncio"]

[tool.setuptools.dynamic]
version = { attr = "vallox_websocket_api.__version__" }

[tool.setuptools.packages.find]
include = ["vallox_websocket_api*"]

[tool.setuptools.package-data]
vallox_websocket_api = ["py.typed", "data/*.json"]

[tool.black]
target-version = ["py311", "py312", "py313", "py314", "py315"]
exclude = 'generated'

[tool.isort]
# https://github.com/PyCQA/isort/wiki/isort-Settings
profile = "black"
# will group `import x` and `from x import` of the same module.
force_sort_within_sections = true
known_first_party = [
    "vallox_websocket_api",
    "tests",
]
forced_separate = [
    "tests",
]
combine_as_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = "build"

[tool.coverage.report]
show_missing = true

[tool.tox]
requires = ["tox>=4.22"]
env_list = ["py311", "py312", "py313", "py314", "py315"]
skip_missing_interpreters = true

[tool.tox.env_run_base]
change_dir = "tests"
dependency_groups = ["test"]
commands = [["pytest", "--basetemp={env_tmp_dir}", { replace = "posargs", extend = true }]]
